<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8" />
<style>
  /* הגופן נלקח מהמערכת ולא מהרשת: הצעת מחיר נבנית לפעמים במטוס או ברכב,
     ו-@import שנכשל בשקט מחליף עברית יפה בעברית של ברירת מחדל. */
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0;
    font-family: "Assistant", "Heebo", "Arial Hebrew", "Noto Sans Hebrew", Arial, sans-serif;
    color: {{TEXT}};
    font-size: 11pt;
    line-height: 1.55;
  }
  .page {
    direction: rtl;
    width: 210mm;
    min-height: 297mm;
    padding: 18mm 16mm 22mm;
    position: relative;
    background: #fff;
  }

  /* 🔴 כל מספר יורד ל-LTR משלו. בלי זה "1,200 ₪" מתהפך על הדף בעברית
     ונראה כמו "₪ 200,1", וזה קורה רק בהדפסה ולא במסך. */
  .num { direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: flex-start; gap: 10mm; border-bottom: 3px solid {{BRAND}}; padding-bottom: 6mm; }
  .logo { height: 18mm; width: auto; max-width: 55mm; object-fit: contain; }
  .biz { flex: 1; }
  .biz h1 { margin: 0; font-size: 19pt; color: {{BRAND}}; letter-spacing: -0.3px; }
  .biz .tagline { margin: 1mm 0 0; font-size: 10pt; opacity: .7; }
  .meta { text-align: left; font-size: 9.5pt; opacity: .8; line-height: 1.7; }

  h2.title { margin: 9mm 0 1mm; font-size: 15pt; color: {{BRAND}}; }
  .to { font-size: 11pt; margin: 0 0 5mm; }
  .to b { font-weight: 700; }
  .intro { margin: 0 0 7mm; font-size: 10.5pt; opacity: .9; white-space: pre-line; }

  table { width: 100%; border-collapse: collapse; margin-bottom: 6mm; }
  thead th {
    background: {{BRAND}}; color: {{ON_BRAND}}; font-size: 10pt; font-weight: 600;
    padding: 3mm 3.5mm; text-align: right;
  }
  thead th.left { text-align: left; }
  tbody td { padding: 3.5mm; border-bottom: 1px solid #e6e6e6; vertical-align: top; font-size: 10.5pt; }
  tbody td.left { text-align: left; }
  tbody .detail { display: block; font-size: 9.5pt; opacity: .65; margin-top: 1mm; }

  .totals { width: 78mm; margin-right: auto; margin-left: 0; }
  .totals tr td { border: 0; padding: 2mm 3mm; font-size: 10.5pt; }
  .totals tr.grand td {
    border-top: 2px solid {{BRAND}}; font-size: 13pt; font-weight: 700; color: {{BRAND}}; padding-top: 3mm;
  }

  .terms { margin-top: 10mm; background: {{SOFT}}; border-right: 4px solid {{BRAND}}; padding: 5mm 6mm; border-radius: 2mm; }
  .terms h3 { margin: 0 0 2.5mm; font-size: 10.5pt; color: {{BRAND}}; }
  .terms ul { margin: 0; padding-right: 5mm; font-size: 10pt; line-height: 1.8; }

  .signoff { margin-top: 10mm; font-size: 10.5pt; }
  footer {
    position: absolute; bottom: 10mm; right: 16mm; left: 16mm;
    border-top: 1px solid #e6e6e6; padding-top: 3mm;
    font-size: 8.5pt; opacity: .6; display: flex; justify-content: space-between;
  }
  .sample {
    position: absolute; top: 0; right: 0; left: 0;
    background: #b45309; color: #fff; font-size: 9pt; text-align: center; padding: 1.5mm;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="page">
  {{SAMPLE_BANNER}}
  <header>
    {{LOGO}}
    <div class="biz">{{BIZ_BLOCK}}</div>
    <div class="meta">
      <div>הצעת מחיר <span class="num">{{QUOTE_NUMBER}}</span></div>
      <div><span class="num">{{DATE}}</span></div>
    </div>
  </header>

  <h2 class="title">{{TITLE}}</h2>
  <p class="to">לכבוד <b>{{CLIENT}}</b>{{CLIENT_COMPANY}}</p>
  <div class="intro">{{INTRO}}</div>

  <table>
    <thead>
      <tr>
        <th style="width:52%">מה כלול</th>
        <th style="width:12%">כמות</th>
        <th style="width:18%">מחיר ליחידה</th>
        <th style="width:18%" class="left">סה״כ</th>
      </tr>
    </thead>
    <tbody>
      {{ROWS}}
    </tbody>
  </table>

  <table class="totals">
    {{TOTALS}}
  </table>

  {{TERMS}}

  <div class="signoff">
    בשמחה,<br />
    <b>{{CONTACT_NAME}}</b>
  </div>

  <footer>
    <span>{{FOOTER_LEFT}}</span>
    <span class="num">{{FOOTER_RIGHT}}</span>
  </footer>
</div>
</body>
</html>
