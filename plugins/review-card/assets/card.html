<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כרטיס ביקורת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<!--
  כרטיס-ביקורת. קובץ אחד, בלי שרת, בלי התקנה.

  🔴 למה קנבס ולא HTML שמצלמים ממנו מסך:
  הקובץ הזה הולך לבעל עסק שלא יודע מה זה DevTools, והוא צריך לצאת ממנו עם
  PNG בגודל 1080x1920 ולא עם צילום מסך של דפדפן. שתי דרכים היו אפשריות:
    1. לצייר ב-HTML ולהמיר ל-PNG דרך SVG foreignObject.
    2. לצייר ישר על קנבס.
  הראשונה נשברת בדיוק אצל מי שאין לו ידע לתקן: פונט חיצוני לא נטען בתוך
  SVG-as-image, ובספארי foreignObject מתנהג אחרת לגמרי. השנייה מציירת פעם
  אחת, והתצוגה שרואים היא בדיוק הפיקסלים שיישמרו. **מה שרואים הוא מה שנשמר**,
  וזו הסיבה היחידה שהיא נבחרה.

  הכל נמצא ב-window.__CARD__ למטה. הסקיל כותב אותו, שאר הקובץ לא משתנה.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #10131a; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; gap: 18px; padding: 24px 16px 40px;
    font-family: 'Heebo', 'Arial Hebrew', system-ui, sans-serif; color: #fff;
  }
  #stage { box-shadow: 0 18px 60px rgba(0,0,0,.55); border-radius: 14px; overflow: hidden; }
  /* הקנבס עצמו הוא 1080x1920. התצוגה מוקטנת בלבד, והשמירה תמיד במלוא הגודל. */
  canvas { display: block; width: min(380px, 88vw); height: auto; }
  #bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit; font-size: 19px; font-weight: 700; cursor: pointer;
    border: 0; border-radius: 999px; padding: 15px 34px; color: #fff;
    background: #FF6A15; box-shadow: 0 8px 24px rgba(255,106,21,.35);
  }
  button:active { transform: translateY(1px); }
  .sw { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); cursor: pointer; padding: 0; box-shadow: none; }
  .sw[aria-pressed="true"] { border-color: #fff; border-width: 4px; }
  #hint { font-size: 15px; opacity: .62; text-align: center; max-width: 380px; line-height: 1.6; }
</style>
</head>
<body>

<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>

<div id="bar">
  <button id="save">שמירת התמונה</button>
  <div id="styles"></div>
  <div id="themes"></div>
</div>
<p id="hint">התמונה נשמרת בגודל 1080x1920, בדיוק המידה של סטורי.</p>

<script>
// ── מה שהסקיל ממלא ─────────────────────────────────────────────────────
window.__CARD__ = {
  quote: "חיכיתי שלושה חודשים לפני שהתקשרתי, ובסוף הכל נגמר בפגישה אחת. חבל לי על הזמן שחיכיתי.",
  author: "דנה כ׳",
  detail: "לקוחה מאז 2024",
  stars: 5,
  business: "העסק שלכם",
  eyebrow: "מה שלקוחות אומרים",
  theme: "navy",
  file: "review-card",
  // "quote" = כרטיס הציטוט. "whatsapp" = שחזור של ההודעה כמו שהיא הגיעה.
  style: "quote",
  time: "21:14",          // השעה על הבועה. סתם פרט, ובלעדיו זה לא נראה אמיתי
  reply: "תודה רבה 🙏",   // התשובה הירוקה שלכם. ריק = בלי תשובה
  mirror: false           // אם בטלפון שלכם הצדדים הפוכים, שנו ל-true
};
// ───────────────────────────────────────────────────────────────────────

const THEMES = {
  navy:  { bg: ["#14213D", "#0B1224"], text: "#FFFFFF", accent: "#FF6A15", soft: "rgba(255,255,255,.62)", quoteMark: "rgba(255,255,255,.13)" },
  cream: { bg: ["#F6EFE4", "#EADFCB"], text: "#1B1B1B", accent: "#C2410C", soft: "rgba(0,0,0,.55)",       quoteMark: "rgba(0,0,0,.09)" },
  ink:   { bg: ["#101010", "#000000"], text: "#FFFFFF", accent: "#E8B04B", soft: "rgba(255,255,255,.58)", quoteMark: "rgba(255,255,255,.11)" },
  olive: { bg: ["#22301F", "#131C12"], text: "#F3F0E7", accent: "#D6A756", soft: "rgba(243,240,231,.6)",  quoteMark: "rgba(243,240,231,.12)" }
};

const W = 1080, H = 1920;
// 🔴 אזור בטוח לסטורי. הממשק של אינסטגרם יושב על הפינות, וטקסט שנכנס לשם
// פשוט לא נקרא. כל מה שמצויר נשאר בין 300 ל-1620 בגובה.
const SAFE_TOP = 300, SAFE_BOTTOM = 1620, PAD = 110;
const c = document.getElementById("c");
const ctx = c.getContext("2d");

const font = (w, px) => `${w} ${px}px 'Heebo', 'Arial Hebrew', system-ui, sans-serif`;

// גלישת שורות בעברית. measureText על מילים, ובנייה מימין לשמאל בעזרת
// ctx.direction = "rtl", שמסדר את השורה עצמה נכון גם כשיש בה מספר או מילה באנגלית.
function wrap(text, maxW) {
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// הקטנה עד שנכנס: גם ברוחב וגם בגובה. ציטוט ארוך לא נחתך ולא גולש, הוא קטן.
function fitQuote(text, maxW, maxH, startPx) {
  for (let px = startPx; px >= 34; px -= 2) {
    ctx.font = font(900, px);
    const lines = wrap(text, maxW);
    const lh = Math.round(px * 1.38);
    if (lines.length * lh <= maxH) return { px, lines, lh };
  }
  ctx.font = font(900, 34);
  return { px: 34, lines: wrap(text, maxW), lh: 47 };
}

function drawQuote() {
  const D = window.__CARD__;
  const T = THEMES[D.theme] || THEMES.navy;

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, T.bg[0]); g.addColorStop(1, T.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.direction = "rtl";
  ctx.textAlign = "right";
  const right = W - PAD, maxW = W - PAD * 2;

  // 🔴 מודדים את כל הבלוק ורק אז מציירים, כדי למרכז אותו לגובה.
  // בגרסה הראשונה הכל התחיל מלמעלה בגובה קבוע, וציטוט קצר השאיר שליש
  // כרטיס ריק בתחתית. **אורך הביקורת אינו בשליטתנו**, ולכן הפריסה היא
  // שמתאימה את עצמה אליו ולא הפוך.
  const FOOTER_H = D.business ? 120 : 0;
  const headH = (D.eyebrow ? 54 : 0) + (D.stars > 0 ? 96 : 0);
  const tailH = 44 + 88 + (D.detail ? 58 : 0);          // קו, שם, ופרט
  const roomForQuote = (SAFE_BOTTOM - FOOTER_H) - SAFE_TOP - headH - tailH - 120;
  const q = fitQuote(D.quote, maxW, roomForQuote, 118);
  const quoteH = q.lines.length * q.lh;

  const blockH = headH + 60 + quoteH + tailH;
  let y = SAFE_TOP + Math.max(0, ((SAFE_BOTTOM - FOOTER_H) - SAFE_TOP - blockH) / 2);

  // גרש פתיחה גדול ודהוי. סימן ולא קישוט: הוא אומר "זה ציטוט" בלי מילה אחת.
  ctx.font = font(900, 300);
  ctx.fillStyle = T.quoteMark;
  ctx.fillText("”", right + 18, y + 100);

  if (D.eyebrow) {
    ctx.font = font(700, 40);
    ctx.fillStyle = T.accent;
    ctx.fillText(D.eyebrow, right, y + 40);
    y += 54;
  }

  if (D.stars > 0) {
    ctx.font = font(400, 62);
    ctx.fillStyle = T.accent;
    ctx.fillText("★".repeat(Math.min(5, D.stars)), right, y + 62);
    y += 96;
  }

  y += 60;
  ctx.fillStyle = T.text;
  ctx.font = font(900, q.px);
  let qy = y + q.px;
  for (const line of q.lines) { ctx.fillText(line, right, qy); qy += q.lh; }
  y += quoteH;

  // קו קצר בצבע ההדגשה מפריד בין הציטוט למי שאמר אותו.
  ctx.fillStyle = T.accent;
  ctx.fillRect(right - 96, y + 40, 96, 7);

  ctx.fillStyle = T.text;
  ctx.font = font(700, 46);
  ctx.fillText(D.author || "", right, y + 132);

  if (D.detail) {
    ctx.fillStyle = T.soft;
    ctx.font = font(400, 36);
    ctx.fillText(D.detail, right, y + 190);
  }

  if (D.business) {
    ctx.fillStyle = T.soft;
    ctx.font = font(700, 38);
    ctx.textAlign = "center";
    ctx.fillText(D.business, W / 2, SAFE_BOTTOM - 20);
    ctx.textAlign = "right";
  }
}

// ═══ סגנון 2: שחזור של ההודעה כמו שהיא הגיעה בוואטסאפ ═══════════════════
//
// 🔴 למה **שחזור** ולא ניקוי של צילום המסך שלהם, וזו החלטה ולא קיצור דרך:
// צילום מסך אמיתי נושא איתו את מספר הטלפון, את תמונת הפרופיל, ואת השורה
// הקודמת בשיחה. **מי שמעלה אותו לסטורי מפרסם דברים שהוא לא שם לב אליהם.**
// שחזור מציג בדיוק את מה שבחרו להציג, בגודל שנקרא בטלפון, ובלי מה שלא
// שייך. זה גם מה שהופך את זה לאותנטי יותר ולא פחות: אותה בועה, בלי הרעש.
const WA = {
  light: { bg: "#ECE5DD", header: "#075E54", headerText: "#FFFFFF", headerSub: "rgba(255,255,255,.72)",
           inBubble: "#FFFFFF", inText: "#111B21", outBubble: "#DCF8C6", outText: "#111B21",
           meta: "#667781", avatar: "#B9C4C9", stamp: "rgba(0,0,0,.45)" },
  dark:  { bg: "#0B141A", header: "#202C33", headerText: "#E9EDEF", headerSub: "rgba(233,237,239,.6)",
           inBubble: "#202C33", inText: "#E9EDEF", outBubble: "#005C4B", outText: "#E9EDEF",
           meta: "#8696A0", avatar: "#3B4A54", stamp: "rgba(255,255,255,.45)" }
};
const waTheme = () => WA[(window.__CARD__.theme === "cream" || window.__CARD__.theme === "olive") ? "light" : "dark"];

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

// בועה אחת. מחזירה את הגובה שתפסה, כדי שהקוראת תדע איפה מתחילה הבאה.
function bubble(text, top, opts) {
  const T = waTheme();
  const px = opts.px, lh = Math.round(px * 1.42);
  ctx.font = font(400, px);
  const maxTextW = 760;
  const lines = wrap(text, maxTextW);
  const wide = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const timeW = 108;                                   // מקום לשעה ולווים
  const boxW = Math.min(860, Math.max(wide, 260) + 64 + (lines.length === 1 ? timeW : 0));
  const boxH = lines.length * lh + 62;
  const x = opts.right ? W - 60 - boxW : 60;

  ctx.fillStyle = opts.out ? T.outBubble : T.inBubble;
  roundRect(x, top, boxW, boxH, 34);
  // הזנב הקטן. בלעדיו זה מלבן מעוגל, ואיתו זה וואטסאפ.
  ctx.beginPath();
  if (opts.right) { ctx.moveTo(x + boxW - 12, top); ctx.lineTo(x + boxW + 26, top); ctx.lineTo(x + boxW - 12, top + 40); }
  else { ctx.moveTo(x + 12, top); ctx.lineTo(x - 26, top); ctx.lineTo(x + 12, top + 40); }
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = opts.out ? T.outText : T.inText;
  ctx.textAlign = "right";
  let ty = top + 30 + px;
  for (const l of lines) { ctx.fillText(l, x + boxW - 32, ty); ty += lh; }

  // שעה, ואצל היוצאת גם שני הווים הכחולים.
  ctx.font = font(400, 26);
  ctx.fillStyle = T.meta;
  ctx.textAlign = "left";
  const metaY = top + boxH - 24;
  ctx.fillText(window.__CARD__.time || "", x + (opts.out ? 100 : 30), metaY);
  if (opts.out) {
    // שני הווים הכחולים. הם רחוקים מהשעה בכוונה, כי בגרסה הראשונה הם
    // נדרסו עליה והבועה הקצרה נראתה שבורה.
    ctx.strokeStyle = "#53BDEB"; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const dx of [0, 16]) {
      ctx.beginPath();
      ctx.moveTo(x + 28 + dx, metaY - 12); ctx.lineTo(x + 36 + dx, metaY - 4); ctx.lineTo(x + 52 + dx, metaY - 24);
      ctx.stroke();
    }
  }
  ctx.textAlign = "right";
  return boxH;
}

function drawWhats() {
  const D = window.__CARD__;
  const T = waTheme();

  ctx.fillStyle = T.bg; ctx.fillRect(0, 0, W, H);
  ctx.direction = "rtl";
  ctx.textAlign = "right";

  // הכותרת. היא מתחילה למעלה כמו במסך אמיתי, אבל **כל מה שחשוב בה יושב
  // מתחת ל-180**, כי שם נגמר הממשק של הסטורי שמכסה את ראש התמונה.
  ctx.fillStyle = T.header; ctx.fillRect(0, 0, W, 360);
  ctx.fillStyle = T.headerSub;
  ctx.font = font(400, 30);
  ctx.fillText(D.time || "", W - 60, 108);

  const av = 96, avX = W - 70 - av, avY = 226;
  ctx.fillStyle = T.avatar;
  ctx.beginPath(); ctx.arc(avX + av / 2, avY + av / 2, av / 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = T.header;
  ctx.font = font(700, 52);
  ctx.textAlign = "center";
  ctx.fillText((D.author || "?").trim().charAt(0), avX + av / 2, avY + av / 2 + 19);

  ctx.textAlign = "right";
  ctx.fillStyle = T.headerText;
  ctx.font = font(700, 44);
  ctx.fillText(D.author || "", avX - 28, avY + 44);
  ctx.fillStyle = T.headerSub;
  ctx.font = font(400, 30);
  ctx.fillText(D.detail || "", avX - 28, avY + 90);

  // הבועות ממורכזות לגובה באזור השיחה, כדי שלא יידבקו לכותרת.
  const inRight = !D.mirror;                 // הנכנסת מימין, היוצאת משמאל
  const px = D.quote.length > 260 ? 40 : D.quote.length > 150 ? 46 : 52;
  ctx.font = font(400, px);
  const lines = wrap(D.quote, 760).length;
  const inH = lines * Math.round(px * 1.42) + 62;
  const replyH = D.reply ? 106 : 0;
  const total = inH + (replyH ? replyH + 28 : 0) + 96;
  let y = 400 + Math.max(0, (1500 - 400 - total) / 2);

  // גלולת התאריך. פרט קטן שאין בלעדיו, כי בכל מסך וואטסאפ אמיתי הוא שם.
  ctx.font = font(400, 30);
  const dayW = ctx.measureText(D.day || "היום").width + 56;
  ctx.fillStyle = waTheme().inBubble;
  roundRect((W - dayW) / 2, y, dayW, 62, 31);
  ctx.fillStyle = waTheme().meta;
  ctx.textAlign = "center";
  ctx.fillText(D.day || "היום", W / 2, y + 42);
  ctx.textAlign = "right";
  y += 96;

  y += bubble(D.quote, y, { px, right: inRight, out: false });
  if (D.reply) { y += 28; bubble(D.reply, y, { px: 44, right: !inRight, out: true }); }

  if (D.business) {
    ctx.fillStyle = T.stamp;
    ctx.font = font(700, 36);
    ctx.textAlign = "center";
    ctx.fillText(D.business, W / 2, SAFE_BOTTOM + 20);
    ctx.textAlign = "right";
  }
}

function draw() {
  if (window.__CARD__.style === "whatsapp") drawWhats();
  else drawQuote();
}

function render() {
  // הפונט נטען מהרשת. בלי ההמתנה הזאת הציור הראשון יוצא בפונט ברירת המחדל,
  // והמדידה של גלישת השורות נעשית על פונט אחר מזה שנראה בסוף.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  else draw();
  draw();
}

const stylesEl = document.getElementById("styles");
for (const [key, label] of [["quote", "כרטיס"], ["whatsapp", "וואטסאפ"]]) {
  const b = document.createElement("button");
  b.textContent = label;
  b.style.cssText = "font-size:16px;padding:11px 22px;background:#243040";
  b.dataset.style = key;
  b.onclick = () => {
    window.__CARD__.style = key;
    for (const s of stylesEl.children) s.style.background = s.dataset.style === key ? "#FF6A15" : "#243040";
    draw();
  };
  stylesEl.appendChild(b);
}
for (const s of stylesEl.children) s.style.background = s.dataset.style === (window.__CARD__.style || "quote") ? "#FF6A15" : "#243040";

const themesEl = document.getElementById("themes");
for (const name of Object.keys(THEMES)) {
  const b = document.createElement("button");
  b.className = "sw";
  b.style.background = THEMES[name].bg[0];
  b.title = name;
  b.setAttribute("aria-pressed", String(name === window.__CARD__.theme));
  b.onclick = () => {
    window.__CARD__.theme = name;
    for (const s of themesEl.children) s.setAttribute("aria-pressed", String(s.title === name));
    draw();
  };
  themesEl.appendChild(b);
}

document.getElementById("save").onclick = () => {
  const a = document.createElement("a");
  a.download = (window.__CARD__.file || "review-card") + ".png";
  a.href = c.toDataURL("image/png");
  a.click();
};

render();
</script>
</body>
</html>
